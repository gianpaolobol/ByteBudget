name: Store live beta (direct GitHub)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Live beta platform to build and publish
        type: choice
        options: [both, ios, android]
        default: both
      data_source:
        description: Discovery data source
        type: choice
        options: [google, open-pilot]
        default: google
permissions:
  contents: read
concurrency:
  group: bytebudget-store-demo
  cancel-in-progress: false
env:
  BYTEBUDGET_MODE: live
  BYTEBUDGET_API_BASE: ${{ vars.BYTEBUDGET_API_BASE }}
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
  FASTLANE_OPT_OUT_USAGE: '1'
  BUNDLE_GEMFILE: fastlane/Gemfile
jobs:
  ios:
    if: github.ref == 'refs/heads/main' && inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check iOS prerequisites
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROFILE_BASE64 ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub Actions secret: $name"; exit 1; fi
          done
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: bundle install --jobs 4 --retry 3
      - name: Verify real native restaurant service
        if: inputs.data_source != 'open-pilot'
        run: node scripts/check-live-service.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build && npx cap sync ios
        env:
          BYTEBUDGET_OPEN_PILOT: ${{ inputs.data_source == 'open-pilot' }}
      - name: Build signed IPA and send to TestFlight
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios demo
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ByteBudget-iOS-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ios/ByteBudget.ipa
          if-no-files-found: error
          retention-days: 7
  android:
    if: github.ref == 'refs/heads/main' && inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check Android prerequisites
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub Actions secret: $name"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: bundle install --jobs 4 --retry 3
      - name: Verify real native restaurant service
        if: inputs.data_source != 'open-pilot'
        run: node scripts/check-live-service.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build && npx cap sync android
        env:
          BYTEBUDGET_OPEN_PILOT: ${{ inputs.data_source == 'open-pilot' }}
      - name: Build signed AAB and send to Google Play internal testing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android demo
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ByteBudget-Android-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
